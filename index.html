    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="init-link-container">
        <div class="home-eyebrow">A food review blog</div>
        <h1 class="home-title">The Honest Five</h1>
        <p class="home-tagline">Ratings that actually mean something</p>
        <nav>

    <footer>
        <p>&copy; 2024 The Honest Five</p>
    </footer>
    <script>
        // Check if this is an invite or recovery link
        if (window.location.hash) {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const linkType = hashParams.get('type');

            // Redirect if it's either an invite or recovery link
            if (linkType === 'invite' || linkType === 'recovery') {
                // Preserve the entire hash with all parameters
                window.location.href = '/reset-password.html' + window.location.hash;
            }
        }
    </script>
</body>
